[project]
name = "sophos"
version = "0.1.0"
description = "Agent-driven multi-platform chatbot with layered LLM invocation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mint Cider", email = "170254502+MintCider@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",            # WebSocket 客户端，连接 NapCat OneBot WS
    "asyncpg>=0.30",           # 异步 PostgreSQL 驱动
    "pydantic-settings>=2.7",  # 从 .env 加载类型安全的配置
    "imagehash>=4.3",          # 感知哈希（含 Pillow）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
