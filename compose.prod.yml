# ============================================================
# Sophos — 生产环境（叠加在 compose.yml 之上）
# ============================================================
# 用法：
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
# ============================================================

services:
  sophos:
    build: .
    container_name: sophos-bot
    env_file: .env
    environment:
      # 容器间通信用 compose 内部 DNS，而非 localhost
      DATABASE_URL: postgresql+asyncpg://sophos:sophos_dev@postgres:5432/sophos
      # NapCat WebSocket 走内部网络
      ONEBOT_WS_URL: ws://napcat:3001
    depends_on:
      postgres:
        condition: service_healthy
      napcat:
        condition: service_started
    restart: unless-stopped

  postgres:
    # 生产模式不暴露端口到主机
    ports: !reset []

  napcat:
    # 生产模式 WS 端口不暴露到主机（Sophos 通过内部网络连）
    ports:
      - "6099:6099"   # WebUI 仍然暴露，方便管理
