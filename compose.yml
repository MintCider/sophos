services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sophos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sophos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sophos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sophos} -d ${POSTGRES_DB:-sophos}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sophos:
    image: ghcr.io/mintcider/sophos:${SOPHOS_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sophos}:${POSTGRES_PASSWORD:-sophos_dev}@postgres:5432/${POSTGRES_DB:-sophos}
      ONEBOT_WS_URL: ${CONTAINER_ONEBOT_WS_URL:-ws://host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SOPHOS_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./system_prompt.md
        target: /app/system_prompt.md
        read_only: true
        bind:
          create_host_path: false
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped
